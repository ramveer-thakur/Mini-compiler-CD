<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Language Compiler</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #1e1e2f;
    color: white;
    padding: 20px;
}

h1 {
    text-align: center;
}

select, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
}

textarea {
    width: 100%;
    height: 300px;
    background: #111;
    color: #00ff90;
    font-size: 16px;
    padding: 10px;
    box-sizing: border-box;
}

#output {
    background: black;
    color: white;
    padding: 15px;
    min-height: 100px;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>Multi Language Compiler</h1>

<select id="language">
    <option value="mini">MiniLang</option>
    <option value="javascript">JavaScript</option>
    <option value="python">Python</option>
    <option value="c">C</option>
    <option value="cpp">C++</option>
    <option value="java">Java</option>
</select>

<button onclick="runCode()">Run Code</button>

<textarea id="code">let Name = "ram";
print(Name);

int age = 21;
print(age);

int a = 10;
int b = 20;
print(a + b);</textarea>

<h2>Output</h2>
<div id="output">Output will appear here</div>

<script>

/* =========================
   MINI LANGUAGE COMPILER
========================= */

function runMini(source) {

    let variables = {};
    let output = [];

    let lines = source.split("\n");

    function evaluateExpression(expression) {

        expression = expression.trim();

        // String
        if (
            (expression.startsWith('"') &&
             expression.endsWith('"')) ||
            (expression.startsWith("'") &&
             expression.endsWith("'"))
        ) {
            return expression.slice(1, -1);
        }

        // Number
        if (/^-?\d+(\.\d+)?$/.test(expression)) {
            return Number(expression);
        }

        // Variable
        if (Object.prototype.hasOwnProperty.call(
            variables, expression
        )) {
            return variables[expression];
        }

        // Arithmetic expressions
        if (/^[a-zA-Z0-9_+\-*/%().\s]+$/.test(expression)) {

            let replaced = expression.replace(
                /[a-zA-Z_]\w*/g,
                function(name) {

                    if (
                        !Object.prototype.hasOwnProperty.call(
                            variables, name
                        )
                    ) {
                        throw new Error(
                            "Undefined variable: " + name
                        );
                    }

                    let value = variables[name];

                    if (typeof value !== "number") {
                        throw new Error(
                            "Arithmetic requires numbers"
                        );
                    }

                    return String(value);
                }
            );

            if (!/^[0-9+\-*/%().\s]+$/.test(replaced)) {
                throw new Error("Invalid expression");
            }

            return Function(
                '"use strict"; return (' + replaced + ')'
            )();
        }

        throw new Error(
            "Invalid expression: " + expression
        );
    }

    for (let i = 0; i < lines.length; i++) {

        let line = lines[i].trim();

        if (line === "" || line.startsWith("//")) {
            continue;
        }

        // let Name = "ram";
        // int age = 21;
        let declaration = line.match(
            /^(let|int|float|var)\s+([a-zA-Z_]\w*)\s*=\s*(.*?)\s*;?$/
        );

        if (declaration) {

            let name = declaration[2];
            let expression = declaration[3];

            variables[name] = evaluateExpression(expression);

            continue;
        }

        // print(Name);
        let printMatch = line.match(
            /^print\s*\((.*)\)\s*;?$/
        );

        if (printMatch) {

            output.push(
                String(evaluateExpression(printMatch[1]))
            );

            continue;
        }

        // print Name;
        printMatch = line.match(
            /^print\s+(.+?)\s*;?$/
        );

        if (printMatch) {

            output.push(
                String(evaluateExpression(printMatch[1]))
            );

            continue;
        }

        // a = 20;
        let assignment = line.match(
            /^([a-zA-Z_]\w*)\s*=\s*(.*?)\s*;?$/
        );

        if (assignment) {

            let name = assignment[1];

            if (
                !Object.prototype.hasOwnProperty.call(
                    variables, name
                )
            ) {
                throw new Error(
                    "Variable not declared: " + name
                );
            }

            variables[name] = evaluateExpression(
                assignment[2]
            );

            continue;
        }

        throw new Error(
            "Syntax Error at line " + (i + 1) +
            ": " + line
        );
    }

    return output.join("\n");
}


/* =========================
   JAVASCRIPT RUNNER
========================= */

function runJavaScript(source) {

    let logs = [];

    let customConsole = {
        log: function(...args) {
            logs.push(args.join(" "));
        },

        error: function(...args) {
            logs.push("ERROR: " + args.join(" "));
        }
    };

    let execute = new Function(
        "console",
        source
    );

    execute(customConsole);

    return logs.join("\n");
}


/* =========================
   PYTHON RUNNER
========================= */

let pyodideInstance = null;

async function runPython(source) {

    if (!pyodideInstance) {

        document.getElementById("output").textContent =
            "Loading Python Runtime...";

        if (!window.loadPyodide) {

            await new Promise((resolve, reject) => {

                let script = document.createElement("script");

                script.src =
                    "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js";

                script.onload = resolve;

                script.onerror = () => reject(
                    new Error("Python Runtime could not load")
                );

                document.head.appendChild(script);
            });
        }

        pyodideInstance = await loadPyodide();
    }

    await pyodideInstance.runPythonAsync(`
import sys
from io import StringIO

sys.stdout = StringIO()
sys.stderr = StringIO()
`);

    await pyodideInstance.runPythonAsync(source);

    return await pyodideInstance.runPythonAsync(`
sys.stdout.getvalue()
`);
}


/* =========================
   MAIN RUN FUNCTION
========================= */

async function runCode() {

    let language =
        document.getElementById("language").value;

    let source =
        document.getElementById("code").value;

    let output =
        document.getElementById("output");

    output.textContent = "";

    try {

        let result = "";

        if (language === "mini") {

            result = runMini(source);

        }

        else if (language === "javascript") {

            result = runJavaScript(source);

        }

        else if (language === "python") {

            result = await runPython(source);

        }

        else if (
            language === "c" ||
            language === "cpp" ||
            language === "java"
        ) {

            result =
                language.toUpperCase() +
                " requires a compiler backend. " +
                "This standalone HTML cannot compile it.";

        }

        output.textContent = result || "(No Output)";

    }

    catch (error) {

        output.textContent =
            "Error: " + error.message;

    }
}


/* =========================
   LANGUAGE EXAMPLES
========================= */

document.getElementById("language")
.addEventListener("change", function() {

    let language = this.value;

    let examples = {

        mini:
`let Name = "ram";
print(Name);

int age = 21;
print(age);

int a = 10;
int b = 20;
print(a + b);`,

        javascript:
`let Name = "ram";
console.log(Name);

let age = 21;
console.log(age);

let a = 10;
let b = 20;
console.log(a + b);`,

        python:
`Name = "ram"
print(Name)

age = 21
print(age)

a = 10
b = 20
print(a + b)`,

        c:
`#include <stdio.h>

int main() {
    int age = 21;
    printf("%d", age);
    return 0;
}`,

        cpp:
`#include <iostream>
using namespace std;

int main() {
    int age = 21;
    cout << age;
    return 0;
}`,

        java:
`class Main {
    public static void main(String[] args) {
        int age = 21;
        System.out.println(age);
    }
}`
    };

    document.getElementById("code").value =
        examples[language];

});

</script>

</body>
</html>
